<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery</title>
    <style>
        *{
            box-sizing:border-box;
        }
        .one{
            height:800px;
            width:800px;
            border-radius:100%;
            background:black;
            display:flex;
            align-items:center;
            justify-content:center;
            
        }
        .two{
            height:700px;
            width:700px;
            border-radius:100%;
            background:red;
            display:flex;
            align-items:center;
            justify-content:center;
            
        }
        .three{
            height:600px;
            width:600px;
            border-radius:100%;
            background:#fffb00;
            display:flex;
            align-items:center;
            justify-content:center;
            
        }
        .four{
            height:500px;
            width:500px;
            border-radius:100%;
            background:#0dff00;
            display:flex;
            align-items:center;
            justify-content:center;
            
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="circle one">
            <div class="circle two">
                <div class="circle three">
                    <div class="circle four"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
