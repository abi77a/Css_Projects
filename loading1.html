<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing:border-box;
        }
        #container{
            border:2px solid red;
            display:flex;
            justify-content:center;
            height:100vh;
            align-items:center;
            gap:10px;

        }
        .circle{
            height:20px;
            width:20px;
            border-radius:15px;
            background:black;
            animation: 1s infinite alternate load;
        }

        @keyframes load{
                0%{opacity:10%}
                30%{opacity:30%}
                50%{opacity:50%}
                80%{opacity:80%}
                100%{opacity:100%}
                
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="circle one"></div>
        <div class="circle two"></div>
        <div class="circle three"></div>
    </div>
</body>
</html>
