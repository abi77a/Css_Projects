<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile</title>
    <link rel="stylesheet" href="Tile.css">
    <script src="https://kit.fontawesome.com/639ad555fe.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="container">

        <div id="thumbnailContainer">
           <img id="thumbnail" src="dj.jpg"> 

        </div>

        <div id="userDetails">

            <div id="profileContainer">
                <img id="profile" src="search.png">
             </div>
             
             <div id="details">
                <h1 id="TileName">Django Unchained</h1>
             <p id="Director">Quentin Tarantino </p>
             </div>
             
        </div>

        <div id="engagement">
            <div class="love engagementElement">
                <i class="fa-solid fa-heart">20</i>
            </div>

            <div class="comments engagementElement">
                <i class="fa-solid fa-comment">15</i>
            </div>
        </div>
    </div>
</body>
</html>
