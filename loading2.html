<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>
    <style>
        #container{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:10px;
        }
        .box{
            height:20px;
            width:20px;
            animation:2s infinite linear rotateNow;
        }

        .one{
            background:red;
        }

        .two{
            background:blue;
        }

        .three{
            background:yellow;
        }

        @keyframes rotateNow{
            0%{transform:rotate(90deg)}
            25%{transform:rotate(180deg)}
            50%{transform:rotate(270deg)}
            100%{transform:rotate(360deg)}
        }

    </style>
</head>
<body>
    <div id="container">
        <div class="box one"></div>
        <div class="box two"></div>
        <div class="box three"></div>
    </div>
</body>
</html>
